<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-glass: rgba(15, 15, 15, 0.85);
            --border-light: rgba(255, 255, 255, 0.15);
            --accent-green: #30d158;
            --font-main: "Segoe UI Variable Display", "SF Pro Display", -apple-system, sans-serif;
        }

        body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0) !important;
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background: transparent;
            display: flex; justify-content: center; align-items: flex-start;
            font-family: var(--font-main);
            overflow: hidden;
            -webkit-user-select: none;
            -webkit-app-region: no-drag;
            user-select: none;
            cursor: default;
        }

        /* 灵动岛主体 */
        #island-capsule {
            margin-top: 5px;
            width: 130px; /* 初始宽度 */
            height: 40px; /* 初始高度 */
            background: var(--bg-glass);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 30px;
            border: 0.5px solid var(--border-light);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);

            display: flex; align-items: center; justify-content: center;
            transition: all 0.7s cubic-bezier(0.32, 1.5, 0.24, 1); /* 带有回弹的弹性动画 */
            color: white;
            position: relative;

            -webkit-app-region: no-drag; /* 确保胶囊主体也无法触发拖动 */
            pointer-events: auto;        /* 允许鼠标事件，但不是拖动 */
        }

        /* 激活状态 */
        #island-capsule.active {
            width: 320px;
            height: 64px;
            background: rgba(0, 0, 0, 0.95);
        }

        /* 内容容器：负责内部元素的渐变转场 */
        .content-wrapper {
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%;
            transition: opacity 0.3s ease;
        }

        /* 时间文本样式 */
        #time-text {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.8px;
            opacity: 0.9;
        }

        /* 通知区域样式 */
        #notice-area {
            display: none;
            align-items: center;
            gap: 12px;
            width: 90%;
        }

        .icon-box {
            width: 32px; height: 32px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }

        #notice-msg {
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 辅助动画类 */
        .fade-out { opacity: 0; transform: scale(0.95); }
        .fade-in { opacity: 1; transform: scale(1); }

    </style>
</head>
<body>

    <div id="island-capsule">
        <div id="time-wrapper" class="content-wrapper">
            <div id="time-text">00:00:00</div>
        </div>

        <div id="notice-area" class="content-wrapper">
            <div class="icon-box" id="notice-icon">
                <svg t="1772981818493" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="1623" width="200" height="200"><path d="M512 426.688a42.688 42.688 0 0 0-42.688 42.688v298.688a42.688 42.688 0 0 0 85.376 0V469.376A42.688 42.688 0 0 0 512 426.688zM507.776 213.376a59.776 59.776 0 1 0 0 119.552 59.776 59.776 0 0 0 0-119.552z" p-id="1624" fill="#ffffff"></path><path d="M512 0a512 512 0 1 0 0 1024 512 512 0 0 0 0-1024z m0 938.688a426.624 426.624 0 0 1-426.688-426.688c0-235.648 190.976-426.688 426.688-426.688s426.688 190.976 426.688 426.688-190.976 426.688-426.688 426.688z" p-id="1625" fill="#ffffff"></path></svg>
            </div>
            <div id="notice-msg">通知消息</div>
        </div>
    </div>

    <script>
        const capsule = document.getElementById('island-capsule');
        const timeWrapper = document.getElementById('time-wrapper');
        const noticeArea = document.getElementById('notice-area');
        const timeText = document.getElementById('time-text');
        const noticeMsg = document.getElementById('notice-msg');

        let noticeTimer = null;

        // 更新时间逻辑
        setInterval(() => {
            timeText.innerText = new Date().toLocaleTimeString('zh-CN', {hour12: false});
        }, 1000);

        // 核心显示逻辑：带转场动画
        window.showNotice = function(msg) {
            // 1. 先把时间切走
            timeWrapper.style.display = 'none';

            // 2. 更新通知内容
            noticeMsg.innerText = msg;
            noticeArea.style.display = 'flex';

            // 3. 3秒后恢复
            clearTimeout(noticeTimer);
            noticeTimer = setTimeout(() => {
                noticeArea.style.display = 'none';
                timeWrapper.style.display = 'flex';
            }, 3000);
        }

        // 展开收缩逻辑
        window.setExpand = function(val) {
            if (val) {
                capsule.classList.add('active');
            } else {
                capsule.classList.remove('active');
            }
        }
    </script>
</body>
</html>
